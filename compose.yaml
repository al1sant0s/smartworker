services:
  web:
    build: .
    env_file: .env
    environment:
      # Montada a partir das variáveis POSTGRES_* do .env
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MEDIA_ROOT: /app/media
    volumes:
      # Uploads (FileField/ImageField) persistem fora da imagem
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Use "docker compose watch" (ou "docker compose up --watch") no desenvolvimento
    develop:
      watch:
        # Código: sincroniza para o container e reinicia o gunicorn
        - action: sync+restart
          path: .
          target: /app
          ignore:
            - .git/
            - .env
            - environment.yml
            - Dockerfile
            - compose.yaml
            - staticfiles/
            - media/
            - "**/__pycache__/"
            - db.sqlite3
        # Dependências ou imagem: reconstrói a imagem
        - action: rebuild
          path: environment.yml
        - action: rebuild
          path: Dockerfile

  db:
    image: postgres:17
    env_file: .env
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  media_data:
