{% extends "base.html" %}

{% block title %}Alterar senha | Smartworker{% endblock %}
{% block page_title %}Segurança da conta{% endblock %}

{% block content %}
  <div class="row">
    <div class="col-lg-8 col-xl-6">
      <div class="card card-primary card-outline">
        <div class="card-header"><h3 class="card-title">Alterar senha</h3></div>
        <form method="post" novalidate>
          {% csrf_token %}
          <div class="card-body">
            {% include "includes/form_fields.html" %}
          </div>
          <div class="card-footer d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Alterar senha</button>
            <a href="{% url 'two_factor:profile' %}" class="btn btn-link">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
