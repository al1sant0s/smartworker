<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Management</title>
    <!-- Carrega o Tailwind CSS para o visual funcionar instantaneamente -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-50 flex h-screen items-center justify-center p-4 font-sans">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
        
        <!-- Cabeçalho -->
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-slate-800 tracking-tight">Bem-vindo de volta</h2>
            <p class="text-slate-500 text-sm mt-1">Faça login para acessar o painel de gerenciamento</p>
        </div>

        <!-- Mensagens de Erro Globais (ex: senha errada) -->
        {% if form.errors %}
            <div class="mb-6 p-4 bg-red-50 border border-red-200 rounded-xl text-sm text-red-600">
                Usuário ou senha incorretos. Por favor, tente novamente.
            </div>
        {% endif %}

        <!-- Formulário de Login -->
        <form method="post" class="space-y-5">
            {% csrf_token %}

            <!-- Campo de Usuário -->
            <div>
                <label for="{{ form.username.id_for_label }}" class="block text-sm font-semibold text-slate-700 mb-1.5">
                    Usuário
                </label>
                <input type="text" name="username" id="{{ form.username.id_for_label }}" required
                    class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
            </div>

            <!-- Campo de Senha -->
            <div>
                <label for="{{ form.password.id_for_label }}" class="block text-sm font-semibold text-slate-700 mb-1.5">
                    Senha
                </label>
                <input type="password" name="password" id="{{ form.password.id_for_label }}" required
                    class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
            </div>

            <!-- Botão de Enviar -->
            <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl transition-colors cursor-pointer shadow-sm mt-2">
                Entrar no Sistema
            </button>
        </form>

    </div>

</body>
</html>
